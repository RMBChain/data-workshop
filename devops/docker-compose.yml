# 在仓库根目录执行：docker compose -f devops/docker-compose.yml [选项]；或 devops/run-backend-dev.ps1
# 本机开发：仅启动 API（uvicorn --reload）。前端在本机 npm run dev（默认 8701）。
# Label Studio 需单独部署；宿主机与容器内 API 端口固定为 **8702**。
#
# API: http://127.0.0.1:8702/docs
#
# 项目名（Compose 资源前缀：网络、命名卷等）；避免默认使用目录名 devops 产生 devops_* 资源名。

name: data-workshop

services:
  backend:
    build:
      context: ..
      dockerfile: devops/swift4.03-cpu.dockerfile
    image: swift4.03-cpu:latest
    container_name: backend
    working_dir: /data-workshop
    shm_size: "4g"
    # --reload 子进程需能 import backend；--app-dir 将项目根加入路径（仅 PYTHONPATH 在部分环境下不可靠）
    command:
      - uvicorn
      - --app-dir
      - /data-workshop
      - backend.app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8702"
      - --reload
    ports:
      - "127.0.0.1:8702:8702"
    volumes:
      - ..:/data-workshop
      # ModelScope 缓存根（内含 hub/）。宿主路径默认为本仓库上一级相对路径；覆盖：export MODELSCOPE_CACHE_HOST=D:/models/modelscope-cache
      - ${MODELSCOPE_CACHE_HOST:-../.cache/docker-modelscope}:/opt/modelscope-cache:rw
    environment:
      - WORKSHOP_LABEL_STUDIO_URL=http://host.docker.internal:8080
      - WORKSHOP_MERGE_USE_TMP_STAGING=1
      # 数据根：SQLite 为 $WORKSHOP_WORKSPACE_ROOT/state/workshop.db；与代码根 /data-workshop 分离
      - PYTHONPATH=/data-workshop
      - WORKSHOP_WORKSPACE_ROOT=/data-workshop/working-dir/data-workshop
      - WORKSHOP_LOG_LEVEL=INFO
      # 与上列 volumes 中 /opt/modelscope-cache 一致（魔搭/HF 下载的模型落在此目录下 hub/）
      - MODELSCOPE_CACHE=/opt/modelscope-cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  label-studio:
    image: heartexlabs/label-studio:20260421.012345-main-a5c6f37
    container_name: label-studio
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
    volumes:
      # 相对 devops/，与在仓库根执行 Get-Location 时 working_dir/label-studio 一致
      - ../working-dir/label-studio:/label-studio/data
    restart: always
