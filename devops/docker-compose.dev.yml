# 与 docker-compose.yml 叠加使用：后端在容器内开发（uvicorn --reload）。
# 典型用法（不启动生产用 web 镜像，省构建时间）：
#   docker compose --env-file devops/compose.env.dev -f docker-compose.yml -f devops/docker-compose.dev.yml up -d --build api
# 宿主机 8701/8702 由 compose.env.dev 与 WORKSHOP_HOST_* 注入。前端在本机：cd frontend && npm run dev

services:
  api:
    command:
      - uvicorn
      - backend.app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
    # 确保热重载叠加后进程仍收到库路径（旧镜像或未继承根 compose 的 environment 时避免落到绑定挂载上的 state/workshop.db）
    environment:
      WORKSHOP_DB_PATH: /var/lib/workshop/workshop.db
